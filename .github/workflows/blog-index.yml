# The blog worker commits an article and its cover and stops there. Everything
# that POINTS at an article — public/blogManifest.json, the sitemap, the RSS
# feed, llms-full.txt — is generated, so each post it published arrived
# unlisted: the site still described the previous count and the newest article
# was reachable only by typing its URL. It happened twice in four days and was
# swept up by hand both times.
#
# scripts/build-blog.mjs is the single source of truth for those files, so it
# runs here, on the worker's own commit. Note what is NOT run: `npm run blog`
# is the seeder plus the generator, and the seeder WRITES NEW ARTICLES. Only
# the generator belongs in CI.
name: Blog index

on:
  push:
    branches: [master]
    # Only the article source. The files this workflow writes are deliberately
    # not listed, and a push made with GITHUB_TOKEN does not start another
    # workflow anyway — two reasons it cannot chase its own tail.
    paths:
      - 'content/blog/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      # The branch as it is now, not the commit that started the run. The
      # worker pushes an article and then its cover as two commits a second
      # apart; the first run (25 Oct) built on the article commit, and by the
      # time it pushed, the cover had landed on top, so the push was refused
      # and the whole run failed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the generator imports fs, path and url and nothing else.
      # Built on the newest commit each time round: if anything lands while
      # this runs, the push is refused, and the index is simply rebuilt on top
      # of it and pushed again — never a merge of generated files.
      - name: Rebuild the blog index and commit it
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'keke-blog-index'
          git config user.email 'info@kekemanager.com'
          for attempt in 1 2 3; do
            git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            node scripts/build-blog.mjs
            git add lib/generated public/blogManifest.json public/sitemap.xml \
                    public/blog public/llms-full.txt
            if git diff --cached --quiet; then
              echo 'Index already matches the articles — nothing to commit.'
              exit 0
            fi
            git commit --quiet -m 'Blog index: rebuild for the newest article

          Generated by scripts/build-blog.mjs right after the article landed,
          so a published post is listed the moment it lands.'
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push refused (attempt $attempt) — something landed meanwhile; rebuilding on top of it."
            sleep 5
          done
          exit 1

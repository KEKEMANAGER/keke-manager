<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KEKE Manager — გადმოწერე აპლიკაცია</title>
<meta name="robots" content="noindex,follow">
<meta name="description" content="KEKE Manager — ჩამოტვირთე აპლიკაცია App Store-იდან ან Google Play-დან.">
<link rel="canonical" href="https://kekemanager.com/app">
<style>
  :root{--gold:#F5A623;--ink:#0D0E16;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(70vw 60vh at 110% -10%,rgba(245,166,35,.26) 0%,rgba(245,166,35,0) 60%),
      linear-gradient(150deg,#17192E 0%,var(--ink) 55%,#08090F 100%);
    color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:28px 20px;text-align:center}
  .w{max-width:420px;width:100%}
  img.logo{width:132px;margin:0 auto 26px;display:block}
  h1{font-size:22px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
  p{margin-top:10px;font-size:14.5px;line-height:1.6;color:#AEB4C6}
  .btns{margin-top:26px;display:flex;flex-direction:column;gap:12px}
  a.b{display:block;padding:15px 18px;border-radius:13px;font-size:16px;font-weight:700;
    text-decoration:none;background:var(--gold);color:var(--ink)}
  a.b.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25)}
  .site{margin-top:22px;font-size:13.5px}
  .site a{color:var(--gold);text-decoration:none;font-weight:600}
  .note{margin-top:16px;font-size:12.5px;color:#6E7488;line-height:1.6}
</style>
</head>
<body>
<div class="w">
  <img class="logo" src="/logo.png" alt="KEKE Manager">
  <h1>გადმოწერე KEKE Manager</h1>
  <p>ვერიფიცირებული მძღოლები, ჯავშნები და GPS თვალყური — ერთ აპლიკაციაში.<br>
     <span style="color:#8E95AC">Verified drivers, bookings and live tracking in one app.</span></p>

  <div class="btns">
    <a class="b" id="ios" href="https://apps.apple.com/app/keke-manager/id6809557226">App Store — iPhone</a>
    <a class="b alt" id="android" href="https://play.google.com/store/apps/details?id=com.keke.manager">Google Play — Android</a>
  </div>

  <div class="site">ან გახსენი საიტი: <a href="/">kekemanager.com</a></div>
  <div class="note" id="note">გადამისამართება მაღაზიაში…</div>
</div>

<script>
/* The business card carries one QR, and one QR cannot know which phone is
   reading it. So the card points here and this page does the deciding: an
   iPhone goes to the App Store, an Android phone to Google Play, and anything
   else is left on this page with both buttons visible.

   The redirect is deliberately not instant-on-parse: a visitor who lands here
   from a desktop, or whose store app is missing, still sees a real page. */
(function () {
  var ua = navigator.userAgent || '';
  var IOS = 'https://apps.apple.com/app/keke-manager/id6809557226';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.keke.manager';

  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var target = isIOS ? IOS : (isAndroid ? PLAY : null);
  var note = document.getElementById('note');

  if (!target) {
    note.textContent = 'აირჩიე შენი ტელეფონის მაღაზია.';
    return;
  }
  setTimeout(function () { window.location.replace(target); }, 350);
})();
</script>
</body>
</html>
